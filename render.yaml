# ==============================================================================
# Render Blueprint — GGPoker Spin & Gold Mobile Leaderboard HUD
# Reference: https://render.com/docs/blueprint-spec
# ==============================================================================

services:
  - type: web
    name: gg-leaderboard-mobile
    runtime: python
    plan: free
    region: frankfurt
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.8
      - key: APP_PIN
        value: "7777"
      - key: HERO_NICKNAME
        sync: false
